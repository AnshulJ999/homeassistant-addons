name: Build and Publish HA Add-on Images

on:
  # Auto-trigger when config.yaml version changes
  push:
    branches: [main]
    paths:
      - 'synclyrics/config.yaml'
      - 'synclyrics-beta/config.yaml'
  
  # Manual dispatch - full control over what to build
  workflow_dispatch:
    inputs:
      # ========== STABLE BUILD ==========
      build_stable:
        description: '🟢 Build STABLE add-on'
        type: boolean
        default: true
      stable_version:
        description: 'Stable version (leave empty to use config.yaml)'
        type: string
        default: ''
      stable_branch:
        description: 'Stable branch to clone'
        type: string
        default: 'main'
      
      # ========== BETA BUILD ==========
      build_beta:
        description: '🟡 Build BETA add-on'
        type: boolean
        default: false
      beta_version:
        description: 'Beta version (leave empty to use config.yaml)'
        type: string
        default: ''
      beta_branch:
        description: 'Beta branch to clone'
        type: string
        default: 'development'

env:
  GHCR_REGISTRY: ghcr.io
  # Must be lowercase for GHCR
  IMAGE_BASE: ghcr.io/anshulj999/synclyrics-ha

jobs:
  # ============================================
  # Detect version changes (for push trigger)
  # ============================================
  detect-version-changes:
    runs-on: ubuntu-latest
    outputs:
      stable_changed: ${{ steps.check.outputs.stable_changed }}
      beta_changed: ${{ steps.check.outputs.beta_changed }}
      stable_version: ${{ steps.check.outputs.stable_version }}
      beta_version: ${{ steps.check.outputs.beta_version }}
      is_push: ${{ github.event_name == 'push' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit to compare

      - name: Check for version changes
        id: check
        run: |
          # For push events, compare versions between commits
          # For manual dispatch, use inputs
          
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "🔍 Checking for version changes in push..."
            
            # Get OLD and NEW versions for stable
            OLD_STABLE=$(git show HEAD~1:synclyrics/config.yaml 2>/dev/null | grep '^version:' | head -1 | sed 's/version: *"\(.*\)"/\1/' || echo "")
            NEW_STABLE=$(grep '^version:' synclyrics/config.yaml | head -1 | sed 's/version: *"\(.*\)"/\1/')
            
            # Get OLD and NEW versions for beta
            OLD_BETA=$(git show HEAD~1:synclyrics-beta/config.yaml 2>/dev/null | grep '^version:' | head -1 | sed 's/version: *"\(.*\)"/\1/' || echo "")
            NEW_BETA=$(grep '^version:' synclyrics-beta/config.yaml | head -1 | sed 's/version: *"\(.*\)"/\1/')
            
            # Check if versions changed
            if [ "$OLD_STABLE" != "$NEW_STABLE" ] && [ -n "$NEW_STABLE" ]; then
              echo "stable_changed=true" >> $GITHUB_OUTPUT
              echo "📦 Stable version changed: $OLD_STABLE → $NEW_STABLE"
            else
              echo "stable_changed=false" >> $GITHUB_OUTPUT
              echo "⏭️ Stable version unchanged: $NEW_STABLE"
            fi
            
            if [ "$OLD_BETA" != "$NEW_BETA" ] && [ -n "$NEW_BETA" ]; then
              echo "beta_changed=true" >> $GITHUB_OUTPUT
              echo "📦 Beta version changed: $OLD_BETA → $NEW_BETA"
            else
              echo "beta_changed=false" >> $GITHUB_OUTPUT
              echo "⏭️ Beta version unchanged: $NEW_BETA"
            fi
            
            echo "stable_version=$NEW_STABLE" >> $GITHUB_OUTPUT
            echo "beta_version=$NEW_BETA" >> $GITHUB_OUTPUT
            
          else
            echo "🔧 Manual dispatch - using input selections..."
            
            # For manual dispatch, read versions from config or inputs
            if [ -n "${{ inputs.stable_version }}" ]; then
              STABLE_VERSION="${{ inputs.stable_version }}"
            else
              STABLE_VERSION=$(grep '^version:' synclyrics/config.yaml | head -1 | sed 's/version: *"\(.*\)"/\1/')
            fi
            
            if [ -n "${{ inputs.beta_version }}" ]; then
              BETA_VERSION="${{ inputs.beta_version }}"
            else
              BETA_VERSION=$(grep '^version:' synclyrics-beta/config.yaml | head -1 | sed 's/version: *"\(.*\)"/\1/')
            fi
            
            echo "stable_changed=${{ inputs.build_stable }}" >> $GITHUB_OUTPUT
            echo "beta_changed=${{ inputs.build_beta }}" >> $GITHUB_OUTPUT
            echo "stable_version=$STABLE_VERSION" >> $GITHUB_OUTPUT
            echo "beta_version=$BETA_VERSION" >> $GITHUB_OUTPUT
          fi

  # ============================================
  # Prepare build matrix
  # ============================================
  prepare:
    needs: detect-version-changes
    if: needs.detect-version-changes.outputs.stable_changed == 'true' || needs.detect-version-changes.outputs.beta_changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      stable_version: ${{ needs.detect-version-changes.outputs.stable_version }}
      beta_version: ${{ needs.detect-version-changes.outputs.beta_version }}
    steps:
      - name: Set build matrix
        id: set-matrix
        run: |
          STABLE_VERSION="${{ needs.detect-version-changes.outputs.stable_version }}"
          BETA_VERSION="${{ needs.detect-version-changes.outputs.beta_version }}"
          STABLE_CHANGED="${{ needs.detect-version-changes.outputs.stable_changed }}"
          BETA_CHANGED="${{ needs.detect-version-changes.outputs.beta_changed }}"
          
          # Determine branches (use defaults for push, inputs for manual)
          if [ "${{ github.event_name }}" == "push" ]; then
            STABLE_BRANCH="main"
            BETA_BRANCH="development"
          else
            STABLE_BRANCH="${{ inputs.stable_branch }}"
            BETA_BRANCH="${{ inputs.beta_branch }}"
          fi
          
          # Build the matrix dynamically
          VARIANTS="[]"
          
          if [ "$STABLE_CHANGED" == "true" ]; then
            VARIANTS=$(echo "$VARIANTS" | jq -c --arg ver "$STABLE_VERSION" --arg branch "$STABLE_BRANCH" '. + [{"variant": "stable", "version": $ver, "branch": $branch, "dockerfile": "synclyrics", "image_suffix": ""}]')
            echo "📦 Adding stable to build matrix: v$STABLE_VERSION from $STABLE_BRANCH"
          fi
          
          if [ "$BETA_CHANGED" == "true" ]; then
            VARIANTS=$(echo "$VARIANTS" | jq -c --arg ver "$BETA_VERSION" --arg branch "$BETA_BRANCH" '. + [{"variant": "beta", "version": $ver, "branch": $branch, "dockerfile": "synclyrics-beta", "image_suffix": "-beta"}]')
            echo "📦 Adding beta to build matrix: v$BETA_VERSION from $BETA_BRANCH"
          fi
          
          # Combine with architectures
          ARCHS='["amd64", "aarch64"]'
          
          # Create full matrix
          MATRIX=$(jq -c -n --argjson variants "$VARIANTS" --argjson archs "$ARCHS" '{include: [($variants[] | . as $v | $archs[] | {variant: $v.variant, version: $v.version, branch: $v.branch, dockerfile: $v.dockerfile, image_suffix: $v.image_suffix, arch: .})]}')
          
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "📦 Build Matrix:"
          echo "$MATRIX" | jq .

  # ============================================
  # Build and push images
  # ============================================
  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    
    steps:
      - name: Checkout homeassistant-addons repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.dockerfile }}
          file: ${{ matrix.dockerfile }}/Dockerfile
          push: true
          platforms: linux/${{ matrix.arch == 'aarch64' && 'arm64' || matrix.arch }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-python:3.12-alpine3.21
            BRANCH=${{ matrix.branch }}
          tags: |
            ${{ env.IMAGE_BASE }}${{ matrix.image_suffix }}-${{ matrix.arch }}:${{ matrix.version }}
            ${{ env.IMAGE_BASE }}${{ matrix.image_suffix }}-${{ matrix.arch }}:latest
          labels: |
            org.opencontainers.image.title=SyncLyrics HA Add-on (${{ matrix.variant }})
            org.opencontainers.image.description=Real-time synchronized lyrics for Home Assistant
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.source=https://github.com/AnshulJ999/SyncLyrics
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}

      - name: Job summary
        run: |
          echo "### ✅ Built: ${{ matrix.variant }} / ${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.IMAGE_BASE }}${{ matrix.image_suffix }}-${{ matrix.arch }}:${{ matrix.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ matrix.branch }}\`" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Final summary
  # ============================================
  summary:
    runs-on: ubuntu-latest
    needs: [detect-version-changes, prepare, build]
    if: always() && needs.prepare.result != 'skipped'
    steps:
      - name: Generate build summary
        run: |
          echo "## 🏠 Home Assistant Add-on Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Show trigger type
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "**Trigger:** 🔄 Auto (version change detected)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Trigger:** 🔧 Manual dispatch" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### What was built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.detect-version-changes.outputs.stable_changed }}" == "true" ]; then
            echo "**Stable:** v${{ needs.prepare.outputs.stable_version }}" >> $GITHUB_STEP_SUMMARY
            echo "- \`ghcr.io/anshulj999/synclyrics-ha-amd64:${{ needs.prepare.outputs.stable_version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`ghcr.io/anshulj999/synclyrics-ha-aarch64:${{ needs.prepare.outputs.stable_version }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Stable:** ⏭️ No version change" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.detect-version-changes.outputs.beta_changed }}" == "true" ]; then
            echo "**Beta:** v${{ needs.prepare.outputs.beta_version }}" >> $GITHUB_STEP_SUMMARY
            echo "- \`ghcr.io/anshulj999/synclyrics-ha-beta-amd64:${{ needs.prepare.outputs.beta_version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`ghcr.io/anshulj999/synclyrics-ha-beta-aarch64:${{ needs.prepare.outputs.beta_version }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Beta:** ⏭️ No version change" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================
  # No changes detected (for push trigger)
  # ============================================
  no-changes:
    runs-on: ubuntu-latest
    needs: detect-version-changes
    if: github.event_name == 'push' && needs.detect-version-changes.outputs.stable_changed != 'true' && needs.detect-version-changes.outputs.beta_changed != 'true'
    steps:
      - name: No version changes
        run: |
          echo "## ⏭️ No Version Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The config.yaml file was modified, but the \`version:\` field did not change." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No build was triggered. To trigger a build, update the version in config.yaml." >> $GITHUB_STEP_SUMMARY
